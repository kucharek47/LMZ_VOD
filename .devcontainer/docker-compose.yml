services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vod_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - siec_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - siec_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi_app:
    build: .
    ports:
      - "${APP_PORT:-13008}:13008"
    environment:
      - POSTGRES_HOST=postgres_db
      - REDIS_URL=redis://redis_cache:6379/0
      - CLOJURE_URL=http://clojure_engine:3000/api/analyze
    env_file:
      - .env
    volumes:
      - ${PATH_FILMS}:/app/media/movies
      - ${PATH_SERIALS}:/app/media/series
    networks:
      - siec_backend
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    restart: unless-stopped

  clojure_engine:
    image: clojure:tools-deps-alpine
    working_dir: /app
    command: tail -f /dev/null
    ports:
      - "3000:3000"
    networks:
      - siec_backend

networks:
  siec_backend:
    driver: bridge

volumes:
  pgdata: